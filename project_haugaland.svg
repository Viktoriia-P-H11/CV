<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHaug" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgHaug)"/>
  
  <!-- Subtle grid lines -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <path d="M200 0 V500 M400 0 V500 M600 0 V500" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Top Bar Mockup -->
  <g transform="translate(40, 30)">
    <rect width="720" height="50" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="25" cy="25" r="7" fill="#38bdf8"/>
    <text x="45" y="31" fill="#f8fafc" font-family="'Roboto', sans-serif" font-weight="700" font-size="16">HAUGALAND SMARTKOMMUNE</text>
    <rect x="580" y="14" width="120" height="22" rx="11" fill="#0284c7" />
    <text x="640" y="29" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">LIVE NO2 ZONE</text>
  </g>

  <!-- Main Hero Card inside mockup -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="450" height="350" rx="14" fill="#1e293b" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>
    
    <text x="30" y="45" fill="#38bdf8" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" letter-spacing="1">MUNICIPAL &amp; CITIZEN PORTAL</text>
    <text x="30" y="78" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="22" font-weight="800">Haugaland SmartKommune</text>
    
    <!-- Badges -->
    <g transform="translate(30, 95)">
      <rect width="95" height="24" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="47" y="16" fill="#38bdf8" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>
      
      <rect x="105" y="0" width="80" height="24" rx="6" fill="rgba(99, 102, 241, 0.2)"/>
      <text x="145" y="16" fill="#a5b4fc" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">React / Vite</text>
      
      <rect x="195" y="0" width="95" height="24" rx="6" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="242" y="16" fill="#34d399" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Nord Pool API</text>
      
      <rect x="300" y="0" width="90" height="24" rx="6" fill="rgba(245, 158, 11, 0.2)"/>
      <text x="345" y="16" fill="#fbbf24" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Leaflet Map</text>
    </g>

    <!-- Content Preview Bars -->
    <rect x="30" y="145" width="390" height="85" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.06)"/>
    <text x="45" y="172" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="12">Live Electricity Spot Price (NO2 Rogaland):</text>
    <text x="45" y="210" fill="#38bdf8" font-family="'Roboto', sans-serif" font-size="28" font-weight="800">0.84 <tspan font-size="15" font-weight="500" fill="#cbd5e1">kr/kWh</tspan></text>
    <rect x="290" y="170" width="115" height="40" rx="8" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="347" y="195" fill="#34d399" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Off-Peak (Lav)</text>

    <!-- Features Checklist -->
    <g transform="translate(30, 255)">
      <circle cx="8" cy="8" r="5" fill="#38bdf8"/>
      <text x="24" y="12" fill="#e2e8f0" font-family="'Roboto', sans-serif" font-size="13">Haugesund Live Weather via Open-Meteo API</text>

      <circle cx="8" cy="38" r="5" fill="#38bdf8"/>
      <text x="24" y="42" fill="#e2e8f0" font-family="'Roboto', sans-serif" font-size="13">Citizen problem reporting with photo attachment</text>

      <circle cx="8" cy="68" r="5" fill="#38bdf8"/>
      <text x="24" y="72" fill="#e2e8f0" font-family="'Roboto', sans-serif" font-size="13">Interactive Map &amp; Energy Savings Calculator</text>
    </g>
  </g>

  <!-- Side Widget Preview -->
  <g transform="translate(510, 100)" filter="url(#shadow)">
    <!-- Weather Card Mockup -->
    <rect width="250" height="165" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="12" font-weight="600">HAUGESUND VÆR</text>
    <text x="20" y="75" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="34" font-weight="800">12°C</text>
    <text x="20" y="105" fill="#38bdf8" font-family="'Roboto', sans-serif" font-size="14">Delvis skyet · Rogaland</text>
    <rect x="20" y="125" width="210" height="25" rx="5" fill="rgba(56, 189, 248, 0.1)"/>
    <text x="125" y="142" fill="#7dd3fc" font-family="'Roboto', sans-serif" font-size="11" text-anchor="middle">Vind: 4.8 m/s · Nedbør: 0 mm</text>

    <!-- Map & Community Card Mockup -->
    <g transform="translate(0, 185)">
      <rect width="250" height="165" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="12" font-weight="600">INTERAKTIVT KART</text>
      <circle cx="60" cy="80" r="28" fill="rgba(2, 132, 199, 0.3)"/>
      <circle cx="60" cy="80" r="10" fill="#38bdf8"/>
      <text x="105" y="75" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="700">Haugalandet</text>
      <text x="105" y="93" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="11">Aktive meldinger</text>
      <rect x="20" y="122" width="210" height="26" rx="6" fill="#0284c7"/>
      <text x="125" y="139" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Se Innbyggerkart</text>
    </g>
  </g>
</svg>
