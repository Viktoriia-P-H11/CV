<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNordic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadowN" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgNordic)"/>
  
  <!-- Grid -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <path d="M200 0 V500 M400 0 V500 M600 0 V500" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Top Bar Mockup -->
  <g transform="translate(40, 30)">
    <rect width="720" height="50" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="25" cy="25" r="7" fill="#10b981"/>
    <text x="45" y="31" fill="#f8fafc" font-family="'Roboto', sans-serif" font-weight="700" font-size="16">SMART NORDIC HOME</text>
    <rect x="560" y="14" width="140" height="22" rx="11" fill="#059669" />
    <text x="630" y="29" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">ENERGY OPTIMIZER</text>
  </g>

  <!-- Main Card Mockup -->
  <g transform="translate(40, 100)" filter="url(#shadowN)">
    <rect width="450" height="350" rx="14" fill="#1e293b" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5"/>
    
    <text x="30" y="45" fill="#10b981" font-family="'Roboto', sans-serif" font-size="13" font-weight="700" letter-spacing="1">ENERGY MANAGEMENT &amp; ANALYTICS</text>
    <text x="30" y="78" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="22" font-weight="800">Smart Nordic Home</text>
    
    <!-- Badges -->
    <g transform="translate(30, 95)">
      <rect width="95" height="24" rx="6" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="47" y="16" fill="#34d399" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">TypeScript</text>
      
      <rect x="105" y="0" width="80" height="24" rx="6" fill="rgba(99, 102, 241, 0.2)"/>
      <text x="145" y="16" fill="#a5b4fc" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">React / Vite</text>
      
      <rect x="195" y="0" width="95" height="24" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="242" y="16" fill="#38bdf8" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Nord Pool API</text>
      
      <rect x="300" y="0" width="105" height="24" rx="6" fill="rgba(245, 158, 11, 0.2)"/>
      <text x="352" y="16" fill="#fbbf24" font-family="'Roboto', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Smart Scheduling</text>
    </g>

    <!-- Energy Chart Curve Mockup -->
    <g transform="translate(30, 140)">
      <rect width="390" height="95" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.06)"/>
      <text x="15" y="22" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="11">24H Spot Price Optimization Curve (NO2)</text>
      
      <!-- Simulated Chart Wave -->
      <path d="M20 70 Q 70 30, 120 75 T 220 50 T 310 80 T 370 40" fill="none" stroke="#10b981" stroke-width="3"/>
      <circle cx="120" cy="75" r="5" fill="#34d399"/>
      <text x="120" y="92" fill="#34d399" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Cheapest: 03:00</text>
      <circle cx="310" cy="80" r="5" fill="#34d399"/>
    </g>

    <!-- Features -->
    <g transform="translate(30, 260)">
      <circle cx="8" cy="8" r="5" fill="#10b981"/>
      <text x="24" y="12" fill="#e2e8f0" font-family="'Roboto', sans-serif" font-size="13">Automated EV charging &amp; heat pump schedule</text>

      <circle cx="8" cy="38" r="5" fill="#10b981"/>
      <text x="24" y="42" fill="#e2e8f0" font-family="'Roboto', sans-serif" font-size="13">Strømstøtte (Norwegian government subsidy) calc</text>

      <circle cx="8" cy="68" r="5" fill="#10b981"/>
      <text x="24" y="72" fill="#e2e8f0" font-family="'Roboto', sans-serif" font-size="13">Monthly electricity bill forecast &amp; savings analytics</text>
    </g>
  </g>

  <!-- Side Widgets Mockup -->
  <g transform="translate(510, 100)" filter="url(#shadowN)">
    <rect width="250" height="165" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="12" font-weight="600">SMART APPLIANCES</text>
    
    <g transform="translate(20, 50)">
      <text x="0" y="16" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="600">Elbil Lader (EV)</text>
      <text x="0" y="32" fill="#10b981" font-family="'Roboto', sans-serif" font-size="11">Starter 02:00 (Lav pris)</text>
      <rect x="155" y="5" width="55" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="182" y="19" fill="#34d399" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AKTIV</text>
    </g>
    
    <g transform="translate(20, 100)">
      <text x="0" y="16" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="13" font-weight="600">Varmtvannstank</text>
      <text x="0" y="32" fill="#38bdf8" font-family="'Roboto', sans-serif" font-size="11">Forhåndsvarmet</text>
      <rect x="155" y="5" width="55" height="22" rx="11" fill="rgba(56, 189, 248, 0.2)"/>
      <text x="182" y="19" fill="#7dd3fc" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" text-anchor="middle">OPTIMAL</text>
    </g>

    <!-- Savings Widget -->
    <g transform="translate(0, 185)">
      <rect width="250" height="165" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="12" font-weight="600">BEREGNET BESPARELSE</text>
      <text x="20" y="80" fill="#34d399" font-family="'Roboto', sans-serif" font-size="34" font-weight="800">32%</text>
      <text x="20" y="105" fill="#94a3b8" font-family="'Roboto', sans-serif" font-size="12">Redusert strømkostnad pr. mnd</text>
      <rect x="20" y="122" width="210" height="26" rx="6" fill="#059669"/>
      <text x="125" y="139" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Se Energirapport</text>
    </g>
  </g>
</svg>
